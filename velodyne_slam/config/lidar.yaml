velodyne_driver_node:
  ros__parameters:
    device_ip: 192.168.1.201               # VLP-16 센서 IP 주소
    port: 2368                             # 라이다 UDP 데이터 수신 포트
    model: VLP16                           # 사용 중인 Velodyne 모델
    rpm: 600.0                             # 라이다 회전 속도(분당 회전수, 약 10 Hz)
    frame_id: velodyne                     # 라이다 메시지의 좌표계 이름
    gps_time: false                        # GPS 시간을 메시지 시각으로 사용할지 여부
    time_offset: 0.0                       # 라이다 메시지 시각에 더할 보정값(초)
    enabled: true                          # 드라이버 시작과 함께 패킷 수신을 활성화
    timestamp_first_packet: true           # 한 바퀴 중 첫 패킷 시각을 스캔 시각으로 사용

velodyne_transform_node:
  ros__parameters:
    model: VLP16                           # 패킷 변환에 사용할 Velodyne 모델
    min_range: 0.9                         # 이 거리보다 가까운 점을 제거(m)
    max_range: 10.0                        # 이 거리보다 먼 점을 제거(m)
    # 전방 240도만 사용하고 노트북이 있는 후방 중앙 120도는 제거한다.
    # 라이다 전방이 0도일 때 120도부터 240도까지가 제외 영역이다.
    view_direction_degree: 0.0             # 사용할 수평 영역의 중심 방향(도, 전방: 0도)
    view_width_degree: 240.0               # 사용할 수평 영역의 폭(도)
    organize_cloud: true                   # 16개 링 구조를 유지한 점군으로 변환할지 여부
    # 측정하지 않은 장착 TF를 적용하지 않고 라이다 좌표계로 점을 유지한다.
    fixed_frame: ""                        # 점 변환에 사용할 고정 좌표계(빈 값: 변환 안 함)
    target_frame: ""                       # 출력 점군 좌표계(빈 값: 센서 좌표계 유지)
    # 패킷 보정 파일은 sensors.launch.py가 velodyne_pointcloud 패키지에서 전달한다.
