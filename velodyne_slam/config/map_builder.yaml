map_builder:
  ros__parameters:
    map_frame: map                         # 누적 지도와 저장 PCD의 좌표계
    map_voxel_size: 0.2                    # 저장 지도 복셀 한 변의 크기(m)
    max_voxels: 1000000                    # 메모리에 유지할 최대 지도 복셀 수
    save_on_shutdown: true                 # 정상 종료할 때 PCD 지도를 자동 저장할지 여부
    # 라이다 원점 오프셋은 lio.launch.py가 lidar_imu_calibration.yaml에서 읽어 전달한다.
    # 같은 이동값을 이 파일에 다시 입력하지 않는다.
    # 연속 처리 스캔에서 지정 횟수만큼 빈 공간으로 관측된 기존 점을 제거한다.
    # 광선이나 대응 오도메트리가 없으면 연속 횟수가 끊기고 점이 다시 검출돼도 초기화된다.
    dynamic_clearing_enabled: true         # 사라진 동적 장애물 점 제거 기능 사용 여부
    clearing_miss_threshold: 5             # 지도점을 지우기까지 필요한 연속 미검출 스캔 수
    clearing_max_range: 10.0               # 빈 공간 광선을 검사할 최대 거리(m)
    clearing_endpoint_margin: 0.4          # 광선 끝의 실제 물체를 보호할 여유 거리(m)
    clearing_ray_stride: 4                 # 빈 공간 검사에 사용할 입력점 간격
    odom_pairing_tolerance: 0.03           # 스캔과 오도메트리 시각 대응 허용 오차(초)
